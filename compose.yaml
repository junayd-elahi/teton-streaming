services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: teton
      POSTGRES_PASSWORD: teton
      POSTGRES_DB: teton
    ports:
      # Local only: the database is for the server and for running tests on this machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teton -d teton"]
      interval: 2s
      timeout: 2s
      retries: 15

  server:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://teton:teton@db:5432/teton?pool_max_conns=16
      LISTEN_ADDR: ":8080"
      INGEST_WRITERS: "4"
      INGEST_QUEUE_SIZE: "5000"
      INGEST_PRIORITY_QUEUE_SIZE: "10000"
      INGEST_BATCH_SIZE: "500"
      INGEST_LINGER_MS: "5"
      # Teton's generator gives each request 5 s in total and does not retry, so under
      # overload a request is held for queue space for up to 4 s before it is refused.
      INGEST_ENQUEUE_TIMEOUT_MS: "4000"
      INGEST_COMMIT_TIMEOUT_MS: "5000"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
