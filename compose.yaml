services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: teton
      POSTGRES_PASSWORD: teton
      POSTGRES_DB: teton
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teton -d teton"]
      interval: 2s
      timeout: 2s
      retries: 15

  server:
    build: .
    environment:
      DATABASE_URL: postgres://teton:teton@db:5432/teton
      LISTEN_ADDR: ":8080"
      INGEST_QUEUE_SIZE: "10000"
      INGEST_BATCH_SIZE: "500"
      INGEST_ENQUEUE_TIMEOUT_MS: "2000"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
